[project]
name = "project-2-kistin-m26-555"
version = "0.1.0"
description = "Консольная база данных на JSON"
readme = "README.md"
authors = [{name = "Кистин Захар", email = "kistin2003@mail.ru"}]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "prompt>=0.4.1",
]

[project.scripts]
database = "primitive_db.main:main"
project = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "primitive_db"

[dependency-groups]
dev = ["ruff>=0.17.0"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
